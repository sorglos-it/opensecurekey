# Fassung MIT RSA. Eingebunden ueber: tools/build.py firmware --variant rsa
#
# Diese Fassung bekommt den AAGUID, der auf 0x01 endet
# (src/classes/ctap/osk_ctap_core.c). Welcher, entscheidet nicht diese
# Datei, sondern die Option darunter - der Quelltext liest sie.
#
# UNGEPRUEFT: ohne nRF Connect SDK ist diese Fassung nicht gebaut.

CONFIG_OSK_RSA=y

# RSA rechnet der SE050, nicht der nRF52840 - darum stehen hier keine
# PSA_WANT_ALG_RSA_*-Zeilen. Wer sie setzt, holt die Mathematik in den
# Flash, in dem der Platz fehlt, und rechnet sie am falschen Ort: der
# private Schluessel darf den Chip nie verlassen.
