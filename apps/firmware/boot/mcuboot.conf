# Einstellungen fuer MCUboot. MCUboot ist Teil des nRF Connect SDK und wird
# BENUTZT, nicht abgeschrieben - hier steht nur, wie es eingestellt wird.
#
# Eingebunden als Kind-Abbild beim Bauen der Firmware:
#   -Dmcuboot_EXTRA_CONF_FILE=<absoluter Pfad>/boot/mcuboot.conf
# (bei sysbuild: SB_CONFIG, Name je SDK-Fassung). Die Zeile gehoert in
# apps/firmware/CMakeLists.txt und steht darum nicht hier.
#
# UNGEPRUEFT: nichts davon ist uebersetzt oder gelaufen. Es gibt keinen
# ARM-Bau und keine Hardware.

# --- Signatur -----------------------------------------------------------
# Nur unterschriebene Pakete. ed25519, weil der Schluessel klein ist und
# die Pruefung ohne grosse Mathematikbibliothek auskommt.
CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y
CONFIG_BOOT_SIGNATURE_TYPE_NONE=n

# Der PRIVATE Schluessel liegt ausserhalb des Projektordners und nie im
# Repo (Repo-Standard, apps/firmware). Der Pfad kommt beim Bauen von
# aussen, hier steht er nicht:
#   CONFIG_BOOT_SIGNATURE_KEY_FILE="<Pfad ausserhalb des Projekts>"
# Fehlt er, baut MCUboot mit seinem eigenen Beispielschluessel - und ein
# Beispielschluessel ist oeffentlich bekannt. Darum prueft tools/sign.py,
# dass der verwendete Schluessel nicht im Projektordner liegt, und
# tools/build.py muss den Bau abbrechen, wenn die Zeile fehlt.
# ANGEFORDERT beim Bau-Strang.

CONFIG_BOOT_VALIDATE_SLOT0=y

# --- Zwei Plaetze, der zweite im externen Flash -------------------------
# Austauschen statt ueberschreiben: nach dem Umschalten liegt die ALTE
# Fassung im zweiten Platz, und der Bootloader kann sie zurueckholen, wenn
# die neue sich nicht meldet. Ueberschreiben waere kleiner und schneller -
# und haette keinen Rueckweg.
CONFIG_BOOT_SWAP_USING_MOVE=y
CONFIG_BOOT_UPGRADE_ONLY=n

# Der zweite Platz liegt im QSPI-Baustein (siehe pm_static.yml).
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_BOOT_MAX_IMG_SECTORS=256

# --- Rueckweg ------------------------------------------------------------
# Die neue Fassung muss sich melden, sonst wird zurueckgedreht. Ohne das
# ist ein Stick mit einer abstuerzenden Fassung Schrott.
CONFIG_BOOT_BOOTSTRAP=n
CONFIG_SINGLE_APPLICATION_SLOT=n

# --- Rueckschritt --------------------------------------------------------
# MCUboot kann einen Zaehler im Abbildkopf pruefen. Wir nutzen das NICHT:
# der Zaehler liegt bei uns im SE050, weil ein Zaehler im Flash
# zurueckzusetzen ist (boot_se050.c). Die Pruefung macht unsere eigene
# Schicht (boot_package.c), eingehaengt ueber die Abbild-Hooks.
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=n
CONFIG_BOOT_IMG_HOOKS=y

# --- Notfallweg ----------------------------------------------------------
# Bootloader-Betrieb, wenn beim Einstecken die Taste gedrueckt ist.
# Welcher Anschluss das ist, sagt der Geraetebaum des Bretts
# (boot/osk_v1.overlay, sobald das eigene Brett da ist).
CONFIG_MCUBOOT_INDICATION_LED=n
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=n
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_BOOT_SERIAL_DETECT_PORT=y

# --- Klein halten --------------------------------------------------------
# Der Bootloader teilt sich 1 MB mit der Firmware. Jedes Kilobyte hier
# fehlt dort.
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_ASSERT=n
