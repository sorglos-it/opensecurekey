# Was die FIRMWARE braucht, damit das Update funktioniert.
#
# ANGEFORDERT beim Bau-Strang: diese Zeilen gehoeren in
# apps/firmware/prj.conf - die Datei gehoert dem Bau-Strang, darum liegen
# sie hier und werden nicht selbst eingetragen.
#
# UNGEPRUEFT: nichts davon ist uebersetzt.

# Die Firmware weiss, dass sie unter MCUboot laeuft, und kann den Zustand
# "umgeschaltet, noch nicht bestaetigt" selbst bestaetigen.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y

# Zugriff auf den zweiten Platz im externen Flash.
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Der Zustand des Updates liegt in der Partition osk_boot_state.
CONFIG_FLASH_MAP_CUSTOM=n

# Der Zaehler im SE050 - erst einschalten, wenn osk_se050.h die zwei
# Zaehlerfunktionen hat (boot_se050.c sagt, welche).
# CONFIG_OSK_SE050_COUNTER=y
