# Fassung OHNE RSA. Eingebunden ueber: tools/build.py firmware --variant norsa
#
# Die Zeile steht hier AUSDRUECKLICH, obwohl n auch die Vorgabe der Option
# ist (apps/firmware/Kconfig). Grund: eine Fassung, die nur durch das
# Weglassen einer Zeile entsteht, ist von einem Versehen nicht zu
# unterscheiden. So steht in beiden Baudateien, welche Fassung gemeint ist,
# und tools/variant.py kann es nachlesen, statt es aus dem Fehlen zu
# schliessen.
#
# Diese Fassung bekommt den AAGUID, der auf 0x02 endet
# (src/classes/ctap/osk_ctap_core.c).
#
# UNGEPRUEFT: ohne nRF Connect SDK ist diese Fassung nicht gebaut.

CONFIG_OSK_RSA=n
