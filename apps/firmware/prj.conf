# Einstellungen der Firmware fuer das nRF52840-Brett.
# Nur was die Quellen wirklich brauchen - jede Zeile, die hier steht,
# kostet Flash, und der Flash ist das Enge am nRF52840 (docs/architecture.md).

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Protokoll ueber die Debug-Leitung. Am Geraet spaeter aus, hier an,
# damit der erste Lauf etwas sagt.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# Krypto: alles ueber PSA, nichts selbst gerechnet
# (src/classes/store/osk_crypto_psa.c, src/classes/se050/se050_crypto_psa.c).
# Der eine Schalter, der die Krypto anmacht: PSA_CRYPTO ("PSA Crypto API").
# Daran haengt die Wahl des Anbieters, auf einem Nordic-ARM von selbst
# PSA_CRYPTO_PROVIDER_CUSTOM, und daran NRF_SECURITY.
#
# CONFIG_NRF_SECURITY wird NICHT gesetzt: es laesst sich nicht setzen
# (def_bool). Wer es trotzdem hinschreibt, bekommt "is assigned in a
# configuration file, but is not directly user-configurable" - gemessen
# am 24.10.2026.
#
# Und ohne PSA_CRYPTO ist der ganze Abschnitt unter "if NRF_SECURITY" gar
# nicht da: die PSA_WANT_*-Zeilen darunter werden dann still verworfen
# ("was assigned the value 'y' but got the value 'n'" - nur eine Warnung,
# kein Fehler), und der Bau scheitert erst viel spaeter am fehlenden
# psa/crypto.h. 21 verworfene Zeilen, zwei Fehler am Ende.
CONFIG_PSA_CRYPTO=y

CONFIG_PSA_WANT_ALG_SHA_1=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_SHA_512=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_ALG_CBC_NO_PADDING=y
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y
CONFIG_PSA_WANT_ALG_CMAC=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_HKDF=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_DETERMINISTIC_ECDSA=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_PURE_EDDSA=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_ECC_SECP_K1_256=y
CONFIG_PSA_WANT_ECC_TWISTED_EDWARDS_255=y
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y

# Anzeige (SSD1306 ueber SPI) und Taster.
CONFIG_GPIO=y
CONFIG_SPI=y

# Tresor im aeusseren Flash (src/classes/store/osk_flash_qspi.c).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
